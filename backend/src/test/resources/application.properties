# Test configuration: use a dedicated in-memory database and keep the
# application-owned data seeder out of the way so tests control their own data.
spring.datasource.url=jdbc:h2:mem:company-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-sample-data=false
# Keep the submission limit out of the way for functional tests; the limiter
# itself is covered by ContactMessageServiceImplTest.
app.contact.max-submissions-per-window=100
# Uploads are written to a temp directory, never into the source tree.
app.images.directory=${java.io.tmpdir}/bizflow-test-uploads
app.images.max-file-bytes=5242880
