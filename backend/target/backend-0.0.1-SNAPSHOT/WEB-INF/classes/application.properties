# ---------------------------------------------------------------------------
# Bizflow Technologies website - backend configuration
#
# No credentials or secrets are stored in source control. Every environment
# specific value is read from an environment variable (or JVM property) and
# falls back to a safe local-development default.
# ---------------------------------------------------------------------------
spring.application.name=company-backend
server.port=${PORT:8080}

# --- Persistence ------------------------------------------------------------
# Local development and tests use an embedded H2 database (PostgreSQL
# compatibility mode) so the application runs with no external services.
# Production deployments use PostgreSQL by exporting:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<database>
#   SPRING_DATASOURCE_USERNAME=<username>
#   SPRING_DATASOURCE_PASSWORD=<password>
#   SPRING_JPA_DDL_AUTO=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:company;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# --- Application settings ---------------------------------------------------
# Origins allowed to call the public JSON API (Angular dev server / SSR server).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}
# Basic abuse protection for the public contact endpoint.
app.contact.max-submissions-per-window=${CONTACT_MAX_SUBMISSIONS:5}
app.contact.rate-window=${CONTACT_RATE_WINDOW:PT10M}
# Seeds illustrative portfolio case studies when the table is empty.
# Set SEED_SAMPLE_DATA=false in production until real projects are added.
app.seed-sample-data=${SEED_SAMPLE_DATA:true}

# --- Administration portal --------------------------------------------------
# NO CREDENTIALS BELOW ARE REAL. Every value is read from the environment and
# has no usable default, so nothing secret is committed to source control.
#
# To create the very first administrator, set these four values before the
# first start. The account is flagged to require a password change at first
# sign in, and the password is never logged:
#   export APP_ADMIN_BOOTSTRAP_USERNAME=...
#   export APP_ADMIN_BOOTSTRAP_EMAIL=...
#   export APP_ADMIN_BOOTSTRAP_PASSWORD=...   # must satisfy the password policy
#   export APP_ADMIN_BOOTSTRAP_DISPLAY_NAME=...
# Once an administrator exists the bootstrap values are ignored.
app.admin.session-minutes=${APP_ADMIN_SESSION_MINUTES:30}
app.admin.max-failed-attempts=${APP_ADMIN_MAX_FAILED_ATTEMPTS:5}
app.admin.lockout-minutes=${APP_ADMIN_LOCKOUT_MINUTES:15}
app.admin.allowed-origins=${APP_ADMIN_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}}
app.admin.bootstrap-username=${APP_ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap-email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-display-name=${APP_ADMIN_BOOTSTRAP_DISPLAY_NAME:}

# --- Uploaded images --------------------------------------------------------
# Administrator uploads are written outside the application's own resources and
# are served only through GET /api/images/{filename}, never by a static handler.
# The directory must not sit inside src/main/resources or the web app root.
app.images.directory=${IMAGE_UPLOAD_DIR:./uploads}
# 5 MB ceiling. Larger images are rejected rather than silently resampled.
app.images.max-file-bytes=${IMAGE_MAX_FILE_BYTES:5242880}
app.images.public-base-path=/api/images/

# --- Cookies and sessions ----------------------------------------------------
# HttpOnly keeps the session cookie out of reach of script; SameSite=Lax blocks
# it on cross site POSTs. Set APP_ADMIN_SECURE_COOKIES=true (and terminate TLS
# in front of the app) for any deployment reachable over the internet.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_ADMIN_SECURE_COOKIES:false}
server.servlet.session.timeout=${APP_ADMIN_SESSION_MINUTES:30}m
server.servlet.session.tracking-modes=cookie

# --- Error handling ---------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
