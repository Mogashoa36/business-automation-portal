# ---------------------------------------------------------------------------
# Bizflow Technologies website - backend configuration
#
# No credentials or secrets are stored in source control. Every environment
# specific value is read from an environment variable (or JVM property) and
# falls back to a safe local-development default.
# ---------------------------------------------------------------------------
spring.application.name=company-backend
server.port=${PORT:8080}

# --- Persistence ------------------------------------------------------------
# Local development and tests use an embedded H2 database (PostgreSQL
# compatibility mode) so the application runs with no external services.
# Production deployments use PostgreSQL by exporting:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<database>
#   SPRING_DATASOURCE_USERNAME=<username>
#   SPRING_DATASOURCE_PASSWORD=<password>
#   SPRING_JPA_DDL_AUTO=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:company;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# --- Application settings ---------------------------------------------------
# Origins allowed to call the public JSON API (Angular dev server / SSR server).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}
# Basic abuse protection for the public contact endpoint.
app.contact.max-submissions-per-window=${CONTACT_MAX_SUBMISSIONS:5}
app.contact.rate-window=${CONTACT_RATE_WINDOW:PT10M}
# Seeds illustrative portfolio case studies when the table is empty.
# Set SEED_SAMPLE_DATA=false in production until real projects are added.
app.seed-sample-data=${SEED_SAMPLE_DATA:true}

# --- Error handling ---------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
