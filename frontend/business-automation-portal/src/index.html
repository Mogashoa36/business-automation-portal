<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <title>Bizflow Technologies | Business Process Automation South Africa</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bizflow Technologies builds software that automates business processes, simplifies operations, and turns manual work into efficient digital workflows. Business process automation, custom business applications and website development in Johannesburg, South Africa."
    />
    <meta name="theme-color" content="#ECE9E4" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
    <link rel="preconnect" href="http://localhost:8080" />

    <!--
      Marks the document as script-enabled so the scroll-reveal styles can hide
      elements before animating them. Without this class (server rendered HTML,
      or a visitor without JavaScript) every element renders visible.
    -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Bizflow Technologies",
        "legalName": "Bizflow Technologies",
        "alternateName": "BIZFLOW",
        "slogan": "Business Process Automation, Custom Business Applications and Website Development.",
        "description": "We build software that automates business processes, simplifies operations, and turns manual work into efficient digital workflows.",
        "areaServed": "South Africa",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Johannesburg",
          "addressRegion": "Gauteng",
          "addressCountry": "ZA"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "17:00"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Process Automation" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Business Applications" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Development" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
