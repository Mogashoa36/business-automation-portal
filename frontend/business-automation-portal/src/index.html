<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <title>Business Automation Company | Business Process Automation South Africa</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="We help businesses replace manual processes with secure, custom software. Business process automation, custom business applications and website development in South Africa."
    />
    <meta name="theme-color" content="#F4F1EC" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
    <link rel="preconnect" href="http://localhost:8080" />

    <!--
      Marks the document as script-enabled so the scroll-reveal styles can hide
      elements before animating them. Without this class (server rendered HTML,
      or a visitor without JavaScript) every element renders visible.
    -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Business Automation Company",
        "description": "Business process automation, custom business applications and website development.",
        "areaServed": "South Africa",
        "email": "info@example.com",
        "telephone": "+27 00 000 0000",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Johannesburg",
          "addressCountry": "ZA"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Process Automation" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Business Applications" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Development" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
