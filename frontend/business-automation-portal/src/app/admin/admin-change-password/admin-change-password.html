<app-admin-page-header
  title="Change password"
  intro="Choose a new password for your own account. You will be signed out afterwards."
/>

@if (message()) {
  <p
    class="notice"
    [class.notice--error]="state() === 'error'"
    [attr.role]="state() === 'error' ? 'alert' : 'status'"
  >
    {{ message() }}
  </p>
}

<div class="panel">
  <form class="panel__body form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field field--full">
      <label class="label" for="currentPassword">Current password</label>
      <input
        id="currentPassword"
        class="input"
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        required
      />
    </div>

    <div class="field field--full">
      <label class="label" for="newPassword">New password</label>
      <input
        id="newPassword"
        class="input"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="field field--full">
      <label class="label" for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        class="input"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="field field--full">
      <p class="hint" id="password-rules">Your password must contain:</p>
      <ul class="rules" aria-labelledby="password-rules">
        @for (rule of rules; track rule) {
          <li>{{ rule }}</li>
        }
      </ul>
    </div>

    <div class="field field--full form-actions">
      <button class="btn btn--primary" type="submit" [disabled]="state() === 'submitting'">
        {{ state() === 'submitting' ? 'Updating...' : 'Change password' }}
      </button>
    </div>
  </form>
</div>
