<app-page-hero
  eyebrow="404"
  title="We could not find that page."
  intro="The link may be out of date, or the address may have a typo in it. Here is where most people were heading."
  [crumbs]="[{ label: 'Not found' }]"
/>

<section class="section">
  <div class="container">
    <ul class="sol-list">
      @for (service of services; track service.slug) {
        <li>
          <a class="sol" [routerLink]="['/services', service.slug]">
            <span class="sol__num">0{{ $index + 1 }}</span>
            <h3 class="sol__title">{{ service.title }}</h3>
            <p class="sol__body">{{ service.tagline }}</p>
            <app-icon class="sol__arrow" name="arrow-right" [size]="22" />
          </a>
        </li>
      }
    </ul>

    <div class="actions">
      <a class="btn btn--primary" routerLink="/">Back to home</a>
      <a class="btn btn--outline" routerLink="/contact">Contact us</a>
    </div>
  </div>
</section>
